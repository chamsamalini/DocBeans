name: CI

on:
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run repository tests
        run: |
          pnpm test:provider-schemas
          pnpm test:course-plan
          pnpm test:training-workflow
          pnpm test:quotation-workflow
          pnpm test:quick-requirements
          pnpm test:word-quotation-template
          pnpm test:document-fonts
          pnpm test:presentation-slide-count
          pnpm test:source-trace-recovery
          pnpm test:presentation-density
          pnpm test:presentation-standards
          pnpm test:proposal-readiness

      - name: Build
        run: pnpm build
